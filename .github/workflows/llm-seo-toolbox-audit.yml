name: LLM SEO Toolbox compatibility gate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Audit the deployed site
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the audit action
        run: pnpm build:action

      - name: Resolve audit target
        id: target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG || 'bradwell-applications' }}
          VERCEL_TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          AUDIT_URL: ${{ vars.LLM_SEO_TOOLBOX_AUDIT_URL || 'https://llm-seo-toolbox.vercel.app' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERCEL_DEPLOYMENT_TIMEOUT_SECONDS: ${{ vars.VERCEL_DEPLOYMENT_TIMEOUT_SECONDS || '600' }}
          VERCEL_DEPLOYMENT_POLL_SECONDS: ${{ vars.VERCEL_DEPLOYMENT_POLL_SECONDS || '10' }}
        run: node scripts/vercel-audit-target.mjs

      - name: Verify preview access
        if: github.event_name == 'pull_request'
        env:
          TARGET: ${{ steps.target.outputs.url }}
        run: |
          # Do not follow redirects here: the bypass header must only reach the
          # preview host. The audit itself follows same-origin redirects safely.
          args=(-sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 30)
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            args+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi

          result=$(curl "${args[@]}" "$TARGET")
          status=${result%% *}
          location=${result#* }

          case "$status" in
            2*|3*) ;;
            401|403)
              echo "::error::The Vercel preview rejected the audit request (HTTP $status). Check VERCEL_AUTOMATION_BYPASS_SECRET or disable Deployment Protection for previews."
              exit 1
              ;;
            *)
              echo "::error::The Vercel preview returned HTTP $status."
              exit 1
              ;;
          esac

          case "$location" in
            *vercel.com/sso-api*|*vercel.com/login*)
              echo "::error::The Vercel preview is protected by SSO. Add the VERCEL_AUTOMATION_BYPASS_SECRET repository secret or disable Deployment Protection for previews, then re-run this job."
              exit 1
              ;;
          esac

      - name: Audit the deployment
        uses: ./actions/audit
        with:
          url: ${{ steps.target.outputs.url }}
          headers: |
            x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          min-score: "80"
          min-grade: "B"
          comment-on-pr: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
