name: LLM SEO Toolbox compatibility gate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Audit the deployed site
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the audit action
        run: pnpm build:action

      - name: Resolve audit target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "url=${{ vars.LLM_SEO_TOOLBOX_AUDIT_URL || 'https://llm-seo-toolbox.vercel.app' }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          url=""
          for attempt in $(seq 1 36); do
            url=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate \
              --jq '.[] | select(.user.login | test("vercel"; "i")) | .body' \
              | grep -oE 'https://[a-z0-9-]+-git-[a-z0-9-]+\.vercel\.app' \
              | head -n 1)
            if [ -n "$url" ]; then break; fi
            sleep 5
          done

          if [ -z "$url" ]; then
            echo "::error::Could not find a Vercel preview URL for PR #$PR_NUMBER. Wait for the Vercel deployment comment or set the LLM_SEO_TOOLBOX_AUDIT_URL repository variable."
            exit 1
          fi

          echo "Resolved Vercel preview: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify preview access
        if: github.event_name == 'pull_request'
        env:
          TARGET: ${{ steps.target.outputs.url }}
        run: |
          args=(-sS -o /dev/null -w '%{http_code} %{url_effective}' -L --max-time 30)
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            args+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi

          result=$(curl "${args[@]}" "$TARGET")
          status=${result%% *}
          effective=${result#* }
          case "$effective" in
            *vercel.com/sso-api*|*vercel.com/login*)
              echo "::error::The Vercel preview is protected by SSO. Add the VERCEL_AUTOMATION_BYPASS_SECRET repository secret or disable Deployment Protection for previews, then re-run this job."
              exit 1
              ;;
          esac
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::error::The Vercel preview rejected the audit request (HTTP $status). Check VERCEL_AUTOMATION_BYPASS_SECRET or disable Deployment Protection for previews."
            exit 1
          fi

      - name: Audit the deployment
        uses: ./actions/audit
        with:
          url: ${{ steps.target.outputs.url }}
          headers: |
            x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          min-score: "80"
          min-grade: "B"
          comment-on-pr: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
